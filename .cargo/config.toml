[target.wasm32-unknown-unknown]
# The Screen Wake Lock API is behind `web_sys_unstable_apis` in web-sys
# 0.3.105 -- all of it, including the `WakeLockSentinel` type, not merely the
# features. `build.rs` cannot supply this: `cargo:rustc-cfg` reaches only the
# building package's own units, and web-sys is a registry dependency compiled
# in its own unit, so the cfg never arrives there.
#
# This file is what makes the documented command work with nothing to
# remember, on this machine and on a fresh CI runner alike.
rustflags = ["--cfg=web_sys_unstable_apis"]
