<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Chess Clock</title>
    <meta
      name="description"
      content="A two-player chess clock with Fischer or Bronstein increment."
    />
    <meta name="theme-color" content="#111827" />
    <meta name="color-scheme" content="dark" />
    <!-- `mobile-web-app-capable` is the current spelling of the install hint.
         The Apple-prefixed name it replaces is deprecated: Chromium logs a
         warning for it on every single load, and the two are equivalent, so
         carrying the old name buys nothing. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Chess Clock" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <style>
      /* The original committed a 13 KiB Tailwind stylesheet and used ten
         utility classes. The rewrite carries the same colours and spacing as
         custom properties, so the stylesheet is the handful of rules below
         rather than a vendored framework. Every value here is the oklch
         equivalent of the Tailwind v4 palette the original used; see
         AGENTS.md. */
      :root {
        --bg: #111827; /* gray-900, the page */
        --panel-idle: #1f2937; /* gray-800, a panel nobody is on */
        --panel-active: #374151; /* gray-700, the player on the clock */
        --panel-flag: #b91c1c; /* red-700, a player who ran out */
        --field: var(--panel-active); /* gray-700, inputs */
        --field-border: #4b5563; /* gray-600 */
        --label: #d1d5db; /* gray-300 */
        --ink: #f9fafb; /* gray-50, the page text */
        --accent: #16a34a; /* green-600, Start */
        --accent-down: #15803d; /* green-700 */
        --focus: #6366f1; /* indigo-500, the focus ring */
        --warn: #eab308; /* yellow-500, Pause */
        --warn-down: #ca8a04; /* yellow-600 */
        --stop: #ef4444; /* red-500, Back */
        --stop-down: #b91c1c; /* red-700 */

        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        background: var(--bg);
        color: var(--ink);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }

      .screen {
        display: flex;
        height: 100dvh;
        padding: 1rem;
      }
      .screen[hidden] {
        display: none;
      }

      /* --- setup --- */
      #setup {
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      #setup h1 {
        font-size: 2.25rem;
        font-weight: 700;
        margin: 0 0 2rem;
      }
      .form {
        width: 100%;
        max-width: 24rem;
        display: grid;
        gap: 1.5rem;
      }
      .row {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 1rem;
      }
      .field {
        display: block;
        min-width: 0;
      }
      .field label {
        display: block;
        color: var(--label);
        font-size: 1.125rem;
        font-weight: 500;
        margin-bottom: 0.5rem;
      }
      .field input,
      .field select {
        width: 100%;
        background: var(--field);
        color: var(--ink);
        border: 1px solid var(--field-border);
        border-radius: 0.5rem;
        padding: 0.75rem;
        font-size: 1.125rem;
        font-family: inherit;
      }
      /* :focus-visible, so the ring shows for a keyboard and not for a tap. */
      .field input:focus-visible,
      .field select:focus-visible,
      button:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
        border-color: var(--focus);
      }
      /* The increment fields are the second row's right two, and the type
         select the first; when there is no increment they dim rather than
         disappear, because the row's layout is the user's mental model. */
      .field[data-inert="true"] {
        opacity: 0.5;
      }

      #start {
        width: 100%;
        background: var(--accent);
        color: #fff;
        font-weight: 700;
        font-size: 1.25rem;
        font-family: inherit;
        padding: 0.75rem 1rem;
        border: 0;
        border-radius: 0.5rem;
        cursor: pointer;
      }
      #start:active {
        background: var(--accent-down);
      }

      /* --- game ---
         Two full-height panels, each reading its own time turned 90° so it
         lies along the phone's length for a player sitting at either edge.

         Both readings are turned the SAME way — 90°, which leaves the text
         facing left, so you tilt your head left to read it. That is the
         author's original: at `006f70c` both spans carried `.rotate-90`
         (`rotate: 90deg`) and both buttons `.rotate-90`, and the two readings
         were not opposed to each other. An earlier version of this rewrite
         turned the lower one the other way on the theory that the clocks
         should face outward from the device's centre. That theory was
         invented here rather than inherited, it was wrong, and it is gone. */
      #game {
        display: grid;
        grid-template-rows: 1fr 1fr;
        padding: 0;
      }
      .panel {
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--panel-idle);
        cursor: pointer;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        transition: background-color 150ms linear;
      }
      /* The 90° turn.
         *
         * ONE property, never two. The `rotate` property and the `transform`
         * property are *different transform functions*, and a browser
         * composes them: setting both to 90deg rotates by 180deg, and the
         * reading renders upside down. Measured in Chromium, on a 200x40 box
         * with a marker on its left edge:
         *
         *   transform:rotate(90deg)  -> marker at (80, -80)   90 deg, correct
         *   rotate:90deg              -> marker at (80, -80)   identical
         *   both                      -> marker at (180, 0)   180 deg, wrong
         *
         * (Those markers are a horizontal 200x40 box, so this table is about
         * the composition, not about the app's layout — the app's panels are
         * tall and narrow, and the direction there is measured in the
         * `#panel-* .reading` rules below.)
         *
         * The original set one (`rotate: 90deg`, in its Tailwind build) and
         * this set two, "for a browser that only knows the old one" — which is
         * not how it works. `transform: rotate()` is understood by every
         * browser that has ever run this app, so the fallback bought nothing
         * and cost the orientation.
         *
         * `transform` is used rather than `rotate` so the rotation still
         * applies in a browser without the independent `rotate`/`translate`
         * properties (Safari before 14.1), which is a real gap and the reason
         * to prefer the older spelling here.
         */
      .panel .reading {
        display: block;
        font-size: clamp(2rem, 12vw, 4.5rem);
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        transform: rotate(90deg);
      }
      .panel[data-state="active"] {
        background: var(--panel-active);
      }
      .panel[data-state="flagged"] {
        background: var(--panel-flag);
      }

      /* The two buttons sit over the panels but must not swallow the taps
         that switch turns, so the overlay is transparent to pointers and only
         the buttons themselves take them. */
      #controls {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 5rem;
        pointer-events: none;
      }
      #controls[hidden] {
        display: none;
      }
      #controls button {
        /* One property, for the same reason as the readings: `rotate` and
           `transform` compose, and setting both turns the label 180deg. Same
           90° as the readings, as in the original. */
        transform: rotate(90deg);
        pointer-events: auto;
        font-family: inherit;
        font-weight: 700;
        font-size: 1.125rem;
        padding: 0.5rem 1rem;
        border: 0;
        border-radius: 0.5rem;
        cursor: pointer;
      }
      #pause {
        background: var(--warn);
        color: #000;
      }
      #pause:active {
        background: var(--warn-down);
      }
      #back {
        background: var(--stop);
        color: #fff;
      }
      #back:active {
        background: var(--stop-down);
      }

      /* The panels are the clock, so nothing about them may move or flash:
         the one animation in the app is a colour change, and a player
         reading it should not have to wait for it. */
      @media (prefers-reduced-motion: reduce) {
        * {
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
        }
      }

      #load-error {
        display: none;
        margin: 1rem 0 0;
        color: #fca5a5;
        font-size: 0.875rem;
        line-height: 1.5;
      }
      #load-error[data-shown="true"] {
        display: block;
      }
      /* Visible only to a screen reader, but present in the shell rather than
         written by Rust: it says what the panels are for, once, to anyone who
         cannot see the rotation. */
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>

  <body>
    <!-- Setup screen. Rust reads these six fields and shows or hides the
         screen; it never writes them back. -->
    <div id="setup" class="screen">
      <h1>Chess Clock</h1>
      <form class="form" id="setup-form">
        <div class="row">
          <div class="field">
            <label for="hours">Hours</label>
            <input id="hours" name="hours" type="number" inputmode="numeric" min="0" step="1" value="0" />
          </div>
          <div class="field">
            <label for="minutes">Minutes</label>
            <input id="minutes" name="minutes" type="number" inputmode="numeric" min="0" max="59" step="1" value="10" />
          </div>
          <div class="field">
            <label for="seconds">Seconds</label>
            <input id="seconds" name="seconds" type="number" inputmode="numeric" min="0" max="59" step="1" value="0" />
          </div>
        </div>
        <div class="row">
          <div class="field">
            <label for="increment-type">Increment Type</label>
            <select id="increment-type" name="increment-type">
              <option value="fischer" selected>Fischer</option>
              <option value="bronstein">Bronstein</option>
            </select>
          </div>
          <div class="field" id="field-increment-minutes">
            <label for="increment-minutes">Increment Minutes</label>
            <input id="increment-minutes" name="increment-minutes" type="number" inputmode="numeric" min="0" step="1" value="0" />
          </div>
          <div class="field" id="field-increment-seconds">
            <label for="increment-seconds">Increment Seconds</label>
            <input id="increment-seconds" name="increment-seconds" type="number" inputmode="numeric" min="0" max="59" step="1" value="0" />
          </div>
        </div>
        <button id="start" type="submit">Start</button>
      </form>
    </div>

    <!-- Game screen. Two panels; the numbers inside them are the only
         dynamic text in the document. -->
    <div id="game" class="screen" hidden>
      <div id="panel-0" class="panel" data-state="idle" role="button" tabindex="0">
        <span class="reading" id="reading-0" role="timer" aria-live="off">00.0</span>
      </div>
      <div id="panel-1" class="panel" data-state="idle" role="button" tabindex="0">
        <span class="reading" id="reading-1" role="timer" aria-live="off">00.0</span>
      </div>
      <p class="visually-hidden">
        Player 1 and Player 2, with the device lying flat between you. Tap your
        own panel when you have moved, or tap the other player's panel to start
        their clock.
      </p>
    </div>

    <!-- Pause and Back, rotated to match the top panel: they sit on the
         device's midline, so neither player owns them. -->
    <div id="controls" hidden>
      <button id="pause" type="button">Pause</button>
      <button id="back" type="button">Back</button>
    </div>

    <p id="load-error" role="alert"></p>

    <script type="module">
      // The whole of the app's JavaScript. The bindings and the wasm are
      // generated by wasm-bindgen; this imports them and starts them.
      //
      // `m.default()` is the load-bearing call, not a formality: the module
      // only runs its `start` function — which is what installs the app — when
      // the generated initializer is invoked. Importing without calling it
      // yields a perfectly valid module that never starts, with no error
      // anywhere: the page loads, the shell renders, and the clock is simply
      // inert. So the shell calls it, and `.catch` turns a genuine failure
      // into a message rather than a blank page.
      import('./app.js')
        .then(m => m.default())
        .catch(error => {
          const message = document.getElementById('load-error');
          message.dataset.shown = 'true';
          message.textContent =
            'Chess Clock could not start. Reload the page, and if it keeps ' +
            'failing, clear this site’s cached files. (' + error + ')';
        });
    </script>
  </body>
</html>
